<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MEDISAFE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand">
            <div class="brand-icon">🏥</div>
            MEDI<span>SAFE</span>
        </a>
        <div class="navbar-nav">
            <a href="/index.html" class="nav-link">Home</a>
            <a href="/login.html" class="nav-btn btn-nav-outline">Login</a>
        </div>
    </nav>

    <div class="auth-page" style="align-items:flex-start;padding-top:calc(var(--navbar-height) + 32px)">
        <div class="auth-card fade-in" style="max-width:580px">
            <div class="auth-header">
                <div class="auth-logo">🏥</div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join MEDISAFE for better healthcare access</p>
            </div>

            <form id="register-form" novalidate>
                <h3 style="font-size:14px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:16px">Personal Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name <span class="required">*</span></label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+977-98XXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="age">Age</label>
                        <input type="number" id="age" name="age" class="form-control" placeholder="Your age" min="1" max="120">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="gender">Gender</label>
                        <select id="gender" name="gender" class="form-select">
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="bloodGroup">Blood Group</label>
                        <select id="bloodGroup" name="bloodGroup" class="form-select">
                            <option value="">Select blood group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="address">Address</label>
                    <input type="text" id="address" name="address" class="form-control" placeholder="City, Country">
                </div>

                <h3 style="font-size:14px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:0.5px;margin:24px 0 16px">Security</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password <span class="required">*</span></label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat your password" required>
                    </div>
                </div>

                <!-- Password Strength -->
                <div id="password-strength" style="margin-top:-12px;margin-bottom:16px;display:none">
                    <div class="progress-bar" style="height:4px;margin-bottom:4px">
                        <div class="progress-bar-fill" id="strength-bar" style="width:0%;transition:width 0.3s ease"></div>
                    </div>
                    <span id="strength-label" style="font-size:12px;color:var(--text-light)"></span>
                </div>

                <div class="form-group">
                    <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;color:var(--text-medium)">
                        <input type="checkbox" id="terms" name="terms" required style="margin-top:3px;flex-shrink:0">
                        I agree to the <a href="#" style="color:var(--primary)">Terms of Service</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login.html" style="font-weight:700">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        Auth.redirectIfLoggedIn();

        // Password strength checker
        const pwInput = document.getElementById('password');
        pwInput.addEventListener('input', function() {
            const val = this.value;
            const strengthDiv = document.getElementById('password-strength');
            const bar = document.getElementById('strength-bar');
            const label = document.getElementById('strength-label');

            if (!val) { strengthDiv.style.display = 'none'; return; }
            strengthDiv.style.display = 'block';

            let strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            const levels = [
                { w: '20%', color: '#dc3545', text: 'Very Weak' },
                { w: '40%', color: '#fd7e14', text: 'Weak' },
                { w: '60%', color: '#ffc107', text: 'Fair' },
                { w: '80%', color: '#20c997', text: 'Good' },
                { w: '100%', color: '#198754', text: 'Strong' }
            ];
            const level = levels[Math.min(strength - 1, 4)] || levels[0];
            bar.style.width = level.w;
            bar.style.background = level.color;
            label.textContent = 'Password Strength: ' + level.text;
            label.style.color = level.color;
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('register-btn');
            Form.clearErrors(form);

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            if (!name || !email || !password) {
                Form.showError(form, 'Please fill in all required fields.');
                return;
            }
            if (password.length < 6) {
                Form.showError(form, 'Password must be at least 6 characters.');
                return;
            }
            if (password !== confirmPw) {
                Form.showError(form, 'Passwords do not match.');
                return;
            }
            if (!terms) {
                Form.showError(form, 'Please accept the Terms of Service to continue.');
                return;
            }

            Form.setLoading(btn, true);
            try {
                const data = await API.post('/auth/register', {
                    name, email, password,
                    phone: document.getElementById('phone').value,
                    age: parseInt(document.getElementById('age').value) || undefined,
                    gender: document.getElementById('gender').value,
                    bloodGroup: document.getElementById('bloodGroup').value,
                    address: document.getElementById('address').value
                });
                Auth.setSession(data.token, data.user);
                Toast.success('Account created successfully! Welcome to MEDISAFE.');
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
            } catch (err) {
                Form.showError(form, err.message || 'Registration failed. Please try again.');
                Form.setLoading(btn, false);
            }
        });
    </script>
</body>
</html>
