<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MEDISAFE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand">
            <div class="brand-icon">🏥</div>
            MEDI<span>SAFE</span>
        </a>
        <div class="navbar-nav">
            <a href="/index.html" class="nav-link">Home</a>
            <a href="/register.html" class="nav-btn btn-nav-primary">Register</a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="auth-logo">🏥</div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your MEDISAFE account</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password <span class="required">*</span></label>
                    <div style="position:relative">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required style="padding-right:46px">
                        <button type="button" id="toggle-password" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);font-size:18px">👁</button>
                    </div>
                    <div class="invalid-feedback">Password is required.</div>
                </div>

                <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
                    <a href="#" style="font-size:13px;color:var(--primary)">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Sign In</button>
            </form>

            <div class="auth-divider">or</div>

            <div style="background:var(--bg-lighter);border-radius:var(--radius);padding:16px;margin-bottom:16px">
                <p style="font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:10px;text-align:center">Demo Credentials</p>
                <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
                    <button onclick="fillDemo('patient')" class="btn btn-outline btn-sm">Patient Demo</button>
                    <button onclick="fillDemo('admin')" class="btn btn-outline btn-sm">Admin Demo</button>
                </div>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html" style="font-weight:700">Create Account</a>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        // Redirect if already logged in
        Auth.redirectIfLoggedIn();

        const toggleBtn = document.getElementById('toggle-password');
        const pwInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isText = pwInput.type === 'text';
            pwInput.type = isText ? 'password' : 'text';
            toggleBtn.textContent = isText ? '👁' : '🙈';
        });

        function fillDemo(role) {
            if (role === 'patient') {
                document.getElementById('email').value = 'bibek@medisafe.com';
                document.getElementById('password').value = 'patient123';
            } else {
                document.getElementById('email').value = 'admin@medisafe.com';
                document.getElementById('password').value = 'admin123';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('login-btn');
            Form.clearErrors(form);

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                Form.showError(form, 'Please enter your email and password.');
                return;
            }

            Form.setLoading(btn, true);
            try {
                const data = await API.post('/auth/login', { email, password });
                Auth.setSession(data.token, data.user);
                Toast.success('Login successful! Welcome back, ' + data.user.name);
                setTimeout(() => {
                    window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
                }, 800);
            } catch (err) {
                Form.showError(form, err.message || 'Invalid email or password.');
                Form.setLoading(btn, false);
            }
        });
    </script>
</body>
</html>
